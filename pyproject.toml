[project]
name = "llama"
version = "0.1.0"
description = "Llama implementation from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch",
    "tqdm",
    "numpy",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true